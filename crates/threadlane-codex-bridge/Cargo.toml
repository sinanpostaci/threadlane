[package]
name = "threadlane-codex-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Codex stdio JSONL to private Unix WebSocket bridge shim for Threadlane"

[[bin]]
name = "threadlane-codex-bridge"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
