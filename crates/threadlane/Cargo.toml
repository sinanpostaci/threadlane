[package]
name = "threadlane"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated local supervisor, CLI, stdio MCP adapter, and Codex wake-up bridge for Threadlane Milestone 1"

[[bin]]
name = "threadlane"
path = "src/main.rs"

[dependencies]
threadlane-operations = { path = "../threadlane-operations", version = "0.1.0" }
axum.workspace = true
clap.workspace = true
fs2.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
reqwest.workspace = true
rmcp.workspace = true
rustix = { version = "1", features = ["process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
threadlane-core.workspace = true
threadlane-workers.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true
