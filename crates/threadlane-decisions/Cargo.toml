[package]
name = "threadlane-decisions"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Advisory decision provider client and schema validation for Threadlane Milestone 4"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
threadlane-connectors = { path = "../threadlane-connectors" }
threadlane-registry = { path = "../threadlane-registry" }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
