[package]
name = "threadlane-native"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Codex app-server proxy client, connection-epoch MCP pairing guard, and busy-turn wake-up adapter for Threadlane Milestone 4"

[[bin]]
name = "threadlane-native-mcp"
path = "src/bin/threadlane-native-mcp.rs"

[[bin]]
name = "threadlane-native-probe"
path = "src/bin/threadlane-native-probe.rs"

[[bin]]
name = "threadlane-approve"
path = "src/bin/threadlane-approve.rs"

[[bin]]
name = "threadlane-workflow"
path = "src/bin/threadlane-workflow.rs"

[[bin]]
name = "threadlane-session"
path = "src/bin/threadlane-session.rs"

[[bin]]
name = "threadlane-context"
path = "src/bin/threadlane-context.rs"

[[bin]]
name = "threadlane-flow"
path = "src/bin/threadlane-flow.rs"

[[bin]]
name = "threadlane-codex-setup"
path = "src/bin/threadlane-codex-setup.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"
threadlane = { path = "../threadlane" }
threadlane-authority = { path = "../threadlane-authority" }
threadlane-core = { path = "../threadlane-core" }
threadlane-host = { path = "../threadlane-host" }
threadlane-operations = { path = "../threadlane-operations" }
threadlane-workers = { path = "../threadlane-workers" }
threadlane-workflow = { path = "../threadlane-workflow" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
toml_edit = "0.25.17"
uuid = { version = "1.8", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
rusqlite.workspace = true
