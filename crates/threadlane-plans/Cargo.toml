[package]
name = "threadlane-plans"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Persistent versioned plan ledger, pure registry resolution compiler, and task replacement reconciliation for Threadlane Milestone 4"

[dependencies]
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
threadlane-registry = { path = "../threadlane-registry", version = "0.1.0" }
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
