[package]
name = "threadlane-host"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Separately owned per-approval local execution host, durable session manifest, and scoped task dispatch client for Threadlane Milestone 4"

[[bin]]
name = "threadlane-host"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
threadlane = { path = "../threadlane", version = "0.1.0" }
threadlane-authority = { path = "../threadlane-authority", version = "0.1.0" }
threadlane-core = { path = "../threadlane-core", version = "0.1.0" }
threadlane-plans = { path = "../threadlane-plans", version = "0.1.0" }
threadlane-operations = { path = "../threadlane-operations", version = "0.1.0" }
threadlane-registry = { path = "../threadlane-registry", version = "0.1.0" }
threadlane-workers = { path = "../threadlane-workers", version = "0.1.0" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
