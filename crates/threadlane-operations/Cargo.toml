[package]
name = "threadlane-operations"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Review subject digests, explicit operator acceptance/integration/push/cleanup workflows, and auxiliary Git/tmux/CodeGraph tool capabilities for Threadlane Milestone 4"

[[bin]]
name = "threadlane-operator"
path = "src/bin/threadlane-operator.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"
threadlane-workers = { path = "../threadlane-workers" }
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
