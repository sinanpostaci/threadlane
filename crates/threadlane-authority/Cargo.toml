[package]
name = "threadlane-authority"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Operator-only workflow approval artifacts and deterministic frozen worker-config synthesis for Threadlane Milestone 4"

[dependencies]
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
threadlane = { path = "../threadlane", version = "0.1.0" }
threadlane-core = { path = "../threadlane-core", version = "0.1.0" }
threadlane-plans = { path = "../threadlane-plans", version = "0.1.0" }
threadlane-registry = { path = "../threadlane-registry", version = "0.1.0" }
threadlane-workers = { path = "../threadlane-workers", version = "0.1.0" }
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
