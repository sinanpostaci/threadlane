name: Packaging validation

# Reusable source-build validation for the automatic Linux checks, and a manual
# full cross-platform packaging run. This workflow does not publish releases,
# sign binaries, create installers, use repository secrets, or modify a host.
# Hosted validation results, including partial failures and the pending
# source-only supervision qualification, are recorded in docs/INSTALL.md. Not
# all action tags, runner images, or the manual macOS/Windows packaging path
# have been qualified.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      linux_only:
        description: Validate only the ubuntu-24.04 linux-x86_64 matrix entry.
        required: false
        type: boolean
        default: false
      skip_artifacts:
        description: Skip release builds, artifact staging, and artifact upload.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"os":"ubuntu-24.04","label":"linux-x86_64"}]' || '[{"os":"ubuntu-24.04","label":"linux-x86_64"},{"os":"macos-14","label":"macos-aarch64"},{"os":"windows-2022","label":"windows-x86_64"}]') }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Report tool versions
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          python --version

      - name: Report Linux disk space before validation
        if: ${{ inputs.skip_artifacts && runner.os == 'Linux' }}
        shell: bash
        run: df -h .

      - name: Configure source-only Rust build resources
        if: ${{ inputs.skip_artifacts }}
        shell: bash
        run: |
          printf '%s\n' \
            'CARGO_PROFILE_DEV_DEBUG=0' \
            'CARGO_PROFILE_TEST_DEBUG=0' \
            'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Type-check and build frontend
        run: npm --prefix apps/desktop run build

      - name: Run frontend tests
        run: npm --prefix apps/desktop test

      - name: Check root Rust workspace formatting
        run: cargo fmt --all -- --check

      - name: Check standalone Tauri workspace formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run Linux worker cleanup regressions
        if: ${{ inputs.skip_artifacts && runner.os == 'Linux' }}
        run: cargo test --locked -p threadlane-workers --test worker_and_git_foundation -- --test-threads=1

      - name: Run root Rust workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run standalone Tauri workspace Clippy
        env:
          CARGO_TARGET_DIR: target/desktop
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run offline CI wrapper tests
        if: ${{ inputs.skip_artifacts && runner.os == 'Linux' }}
        run: python -m unittest discover -s scripts -p test_run_ci_check.py -v

      - name: Run root Rust workspace tests
        if: ${{ inputs.skip_artifacts && runner.os == 'Linux' }}
        run: python scripts/run-ci-check.py --timeout-seconds 3600 -- cargo test --workspace --locked -- --test-threads=1

      - name: Run root Rust workspace tests (manual packaging)
        if: ${{ !inputs.skip_artifacts || runner.os != 'Linux' }}
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Run standalone Tauri workspace tests
        if: ${{ inputs.skip_artifacts && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: target/desktop
        run: python scripts/run-ci-check.py --timeout-seconds 900 -- cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Run standalone Tauri workspace tests (manual packaging)
        if: ${{ !inputs.skip_artifacts || runner.os != 'Linux' }}
        env:
          CARGO_TARGET_DIR: target/desktop
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Run offline packaging wrapper tests
        run: python -m unittest discover -s scripts -p test_build_desktop.py -v

      - name: Build desktop binary through the packaging wrapper
        if: ${{ !inputs.skip_artifacts }}
        run: python scripts/build-desktop.py --release --timeout-seconds 3600

      - name: Build CLI binary
        if: ${{ !inputs.skip_artifacts }}
        run: cargo build --release --locked --package threadlane

      - name: Stage build artifacts
        if: ${{ !inputs.skip_artifacts }}
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f target/release/threadlane ]; then cp target/release/threadlane artifacts/; fi
          if [ -f target/release/threadlane.exe ]; then cp target/release/threadlane.exe artifacts/; fi
          if [ ! -f target/release/threadlane ] && [ ! -f target/release/threadlane.exe ]; then
            echo "CLI binary artifact is missing" >&2
            exit 1
          fi
          if [ -f target/desktop/release/threadlane-desktop ]; then cp target/desktop/release/threadlane-desktop artifacts/; fi
          if [ -f target/desktop/release/threadlane-desktop.exe ]; then cp target/desktop/release/threadlane-desktop.exe artifacts/; fi
          if [ ! -f target/desktop/release/threadlane-desktop ] && [ ! -f target/desktop/release/threadlane-desktop.exe ]; then
            echo "desktop binary artifact is missing" >&2
            exit 1
          fi
          cp -r apps/desktop/dist artifacts/frontend-dist

      - name: Upload build artifacts
        if: ${{ !inputs.skip_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: threadlane-${{ matrix.label }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Report Linux disk space after validation
        if: ${{ always() && inputs.skip_artifacts && runner.os == 'Linux' }}
        shell: bash
        run: df -h .
